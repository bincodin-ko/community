name: qa

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      SESSION_SECRET: ci-only-not-for-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JEV_BASE_URL: http://127.0.0.1:4141/v1/systemone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run ci
      - name: Database
        run: npx prisma db push --skip-generate && npx prisma generate && npm run db:seed:demo
      - name: Build
        run: npx next build
      - name: Start fake Jev and app
        run: |
          node scripts/qa/fake-jev.mjs > fake-jev.log 2>&1 &
          npx next start -p 3000 > server.log 2>&1 &
          up=0; for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && up=1 && break; sleep 1; done
          if [ "$up" != "1" ]; then echo "server did not start"; cat server.log; exit 1; fi
      - name: E2E (flows + moderation)
        run: node scripts/qa/e2e.mjs --base http://localhost:3000
      - name: Copy lint (UI 문구)
        run: node scripts/qa/copy-lint.mjs
      - name: QA walk (Playwright + Jev)
        run: node scripts/qa/walk.mjs --base http://localhost:3000 --out qa-report.md
      - name: Server log
        if: failure()
        run: cat server.log || true
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-report.md
            qa-last.png
            server.log
          if-no-files-found: ignore
